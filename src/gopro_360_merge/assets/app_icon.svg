<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="gopro-360-merge">
  <!-- Rounded app tile -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="sphere" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#5eb8ff"/>
      <stop offset="55%" stop-color="#2f7fd4"/>
      <stop offset="100%" stop-color="#1a4f8c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- 360 sphere -->
  <circle cx="256" cy="248" r="148" fill="url(#sphere)"/>
  <ellipse cx="256" cy="248" rx="58" ry="148" fill="none" stroke="#e8f4ff" stroke-width="14" opacity="0.55"/>
  <ellipse cx="256" cy="248" rx="148" ry="52" fill="none" stroke="#e8f4ff" stroke-width="14" opacity="0.45"/>
  <circle cx="256" cy="248" r="148" fill="none" stroke="#9ecfff" stroke-width="10" opacity="0.35"/>

  <!-- Merge / join chevrons under sphere -->
  <path d="M156 400 L220 400 L256 436 L292 400 L356 400"
        fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188 368 L256 424 L324 368"
        fill="none" stroke="#7dd3fc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
