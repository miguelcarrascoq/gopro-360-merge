[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro-360-merge"
dynamic = ["version"]
description = "Merge chaptered GoPro .360 files by recording block — interactive CLI and desktop GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "miguelcarrascoq" }]
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "customtkinter>=5.2",
]

[tool.setuptools.dynamic]
version = { attr = "gopro_360_merge.__version__" }

[project.optional-dependencies]
icons = [
    "cairosvg>=2.7",
    "pillow>=10",
]

[project.scripts]
gopro-360-merge = "gopro_360_merge.cli:main"
gopro-360-gui = "gopro_360_merge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gopro_360_merge = [
    "vendor/udtacopy.zip",
    "vendor/NOTICE",
    "assets/*",
]
